name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # The Angular version matrix (docs/PLAN.md 9.4, R1's mitigation). The
      # fixture holds only the packages the indexer resolves from an analyzed
      # project, so this is a few seconds and a few megabytes, not a full
      # Angular workspace. Without it, test/integration/version-matrix.test.ts
      # skips itself and the matrix silently does not exist.
      - name: Install the Angular 20 fixture
        run: npm install --no-audit --no-fund
        working-directory: fixtures/v20-app

      - run: pnpm -C packages/server lint

      - run: pnpm -C packages/server typecheck

      - run: pnpm -C packages/server test

      # The Claude Code plugin runs the committed bundle, not a build made on
      # install, so a source change without a rebuild ships stale code.
      - name: The committed plugin bundle matches the source
        run: |
          pnpm -C packages/server build:plugin
          git diff --exit-code -- mcp/ || { echo "::error::mcp/server.bundle.mjs is stale. Run: pnpm -C packages/server build:plugin"; exit 1; }
