<div *ngIf="status === 'ready'; else emptyBlock">
  <ul>
    <li *ngFor="let fact of facts">{{ fact.label }}: {{ fact.value }}</li>
  </ul>
</div>
<ng-template #emptyBlock>
  <p>No data</p>
</ng-template>

<div [ngSwitch]="status">
  <p *ngSwitchCase="'ready'">Ready</p>
  <p *ngSwitchCase="'loading'">Loading</p>
  <p *ngSwitchDefault>Empty</p>
</div>
