<div *ngIf="status === 'ready'; else loadingBlock">
  <ul>
    <li *ngFor="let name of names">{{ greet(name) | shout }}</li>
  </ul>
</div>
<ng-template #loadingBlock>
  <p>Loading...</p>
</ng-template>

<div [ngSwitch]="status">
  <p *ngSwitchCase="'ready'">Ready</p>
  <p *ngSwitchCase="'loading'">Loading</p>
  <p *ngSwitchDefault>Error</p>
</div>

<app-standalone-badge label="Hybrid"></app-standalone-badge>
