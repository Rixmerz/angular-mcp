metadata:
  name: Build Angular MCP
  description: 'Construye el servidor Angular MCP segun docs/PLAN.md: andamiaje, fixtures, extractors,
    grafo, motor de consultas, motor de reglas y herramientas MCP.'
  version: 1.0.0
  type: graph
  author: Rixmerz
nodes:
- id: build
  name: Build
  is_start: true
  is_end: true
  node_type: dag
  prompt_injection: 'Construccion del Angular MCP segun docs/PLAN.md.

    Cada tarea lee el plan antes de escribir codigo y respeta sus principios:

    derivar en vez de recordar, servidor determinista, confianza y

    proveniencia en cada hecho.

    '
  tasks:
  - id: extract-decorators-di
    name: Extractor de decoradores e inyeccion en TypeScript
    max_turns: 120
    role: backend
    complexity: high
    ownership:
    - packages/server/src/indexer/extractors/decorators.ts
    - packages/server/src/indexer/extractors/di.ts
    - packages/server/src/indexer/extractors/modules.ts
    - packages/server/test/indexer/decorators.test.ts
    - packages/server/test/indexer/di.test.ts
    - packages/server/test/indexer/modules.test.ts
    acceptance:
    - Extrae Component, Directive, Pipe, Injectable y NgModule con sus atributos
    - Detecta inyeccion por constructor y por inject()
    - Cubre @Optional, @Inject(TOKEN) e inject(TOKEN, {optional:true})
    - Las pruebas unitarias de la seccion 9.1 del plan pasan
    prompt: "Lee docs/PLAN.md, secciones 5.1, 5.2 y 9.1, antes de escribir nada.\n\nImplementa tres extractors.\
      \ Cada uno recibe un ts.SourceFile y el\ntype checker, y emite nodos y aristas del modelo de\npackages/server/src/graph/model.ts.\
      \ Son funciones puras.\n\n- decorators.ts: Component, Directive, Pipe, Injectable con todos\n  los\
      \ atributos de la tabla 5.1. Distingue standalone de declarado\n  en modulo. Resuelve templateUrl\
      \ relativo al archivo.\n- di.ts: aristas injects. Constructor y inject(). Cubre @Optional,\n  @Inject(TOKEN),\
      \ inject(TOKEN, {optional:true}) e InjectionToken.\n- modules.ts: NgModule con declarations, imports,\
      \ exports,\n  providers, y las aristas provides e imports.\n\nCada arista con provenance y confidence.\
      \ Lo que no puedas resolver\nes confidence 'unknown', nunca una suposicion.\n"
  - id: extract-templates
    name: Extractor de templates en TypeScript
    max_turns: 140
    role: backend
    complexity: high
    ownership:
    - packages/server/src/indexer/extractors/templates.ts
    - packages/server/src/indexer/extractors/selectors.ts
    - packages/server/test/indexer/templates.test.ts
    - packages/server/test/indexer/selectors.test.ts
    acceptance:
    - Parsea templates con parseTemplate del compilador del proyecto
    - Clasifica interpolacion, property, event, two-way y control flow
    - Resuelve selectores contra el scope del componente, standalone o NgModule
    - 'Un template con error de sintaxis no aborta el indice: guarda parseErrors'
    prompt: "Lee docs/PLAN.md, secciones 4.3, 5.2, riesgos R4 y R14, antes de\nescribir nada.\n\nImplementa\
      \ dos archivos.\n\n- templates.ts: parsea el template, en archivo o inline, con\n  parseTemplate\
      \ de @angular/compiler resuelto desde el proyecto\n  analizado. Recorre el AST y emite aristas binds\
      \ clasificadas:\n  interpolacion, property, event, two-way, control flow\n  @if/@for/@switch/@defer/@let,\
      \ directivas estructurales viejas\n  *ngIf/*ngFor, pipes y referencias #ref.\n  Si el parseo falla,\
      \ guarda parseErrors en el nodo Template y\n  continua. Nunca abortes el indice por un template\
      \ roto.\n- selectors.ts: resuelve un tag o atributo del template al\n  Component, Directive o Pipe\
      \ correspondiente. El scope sale del\n  array imports del componente standalone, o de las declarations\n\
      \  del NgModule que lo declara. El caso hibrido, un standalone\n  importado desde un NgModule, debe\
      \ funcionar. Lo que no resuelvas\n  es confidence 'unknown'.\n\nEl tipo de cada binding sale de\
      \ la clase del componente via el\ntype checker de TypeScript. NO uses TemplateTypeChecker.\n"
  - id: indexer
    name: Orquestador del indice en TypeScript
    max_turns: 120
    role: backend
    complexity: high
    dependencies:
    - extract-decorators-di
    - extract-templates
    ownership:
    - packages/server/src/indexer/index.ts
    - packages/server/src/indexer/incremental.ts
    - packages/server/test/indexer/index.test.ts
    - packages/server/test/indexer/incremental.test.ts
    acceptance:
    - Indexa un proyecto completo llamando a todos los extractors
    - La reindexacion incremental solo reprocesa archivos cuyo hash cambio
    - Reporta nodos por tipo, archivos procesados, tiempo y errores de parseo
    - Un archivo roto no aborta el indice
    prompt: "Lee docs/PLAN.md, secciones 4.1 y 7 Fase 1, antes de escribir nada.\n\nImplementa el orquestador\
      \ que recorre los archivos del proyecto,\nllama a cada extractor y construye el ProjectGraph.\n\n\
      - index.ts: indexacion completa de un proyecto de angular.json.\n  Parsea templates bajo demanda\
      \ y cachea.\n- incremental.ts: compara hashes, reindexa solo lo cambiado,\n  invalida las aristas\
      \ que salian de los archivos afectados.\n\nDevuelve un resumen: nodos por tipo, archivos, tiempo,\
      \ errores de\nparseo. Un archivo que falla se registra y se sigue.\n"
  - id: query-tools
    name: Herramientas de consulta e impacto en TypeScript
    max_turns: 150
    role: backend
    complexity: high
    dependencies:
    - indexer
    ownership:
    - packages/server/src/tools/**
    - packages/server/test/tools/**
    acceptance:
    - Las diez herramientas de la Fase 1 de la seccion 6 existen
    - Cada una declara esquema Zod de entrada, outputSchema y anotaciones
    - Todas son readOnlyHint true
    - angular_find_symbol siempre devuelve candidatos, nunca adivina uno
    - angular_impact_of recorre consumidores y dependencias con limite de profundidad
    prompt: "Lee docs/PLAN.md, seccion 6 Fase 1 completa, y los riesgos R7 y\nR13, antes de escribir nada.\n\
      \nImplementa las diez herramientas de la Fase 1, una por archivo, en\npackages/server/src/tools/:\n\
      \nindex_project, get_index_status, find_symbol, get_component,\nget_service, get_route_tree, who_uses,\
      \ get_template_bindings,\nlist_http_calls, impact_of.\n\nTodas con el prefijo angular_. Cada una:\n\
      - Esquema de entrada con Zod, con descripciones en cada campo.\n- outputSchema declarado.\n- Anotaciones:\
      \ readOnlyHint true, destructiveHint false,\n  idempotentHint true, openWorldHint false.\n- Acepta\
      \ limit, offset y format donde corresponda.\n- Errores accionables: que fallo y que intentar despues.\n\
      \nR13: el id de simbolo es ruta#nombre. find_symbol devuelve\ncandidatos. Las demas exigen el ref\
      \ completo y, si reciben un\nnombre ambiguo, devuelven los candidatos en vez de elegir.\n\nR7: cada\
      \ hecho sale con su confidence y su proveniencia. La\ndescripcion de cada herramienta dice explicitamente\
      \ que campos\npueden venir inferidos.\n"
  - id: rules-engine
    name: Motor de reglas de arquitectura en TypeScript
    max_turns: 150
    role: backend
    complexity: high
    dependencies:
    - indexer
    ownership:
    - packages/server/src/rules/**
    - packages/server/test/rules/**
    - docs/RULES.md
    acceptance:
    - Valida angular-mcp.rules.yaml contra un esquema Zod
    - Evalua layers, boundaries y constraints contra el grafo
    - angular_check_rules acepta un diff unificado y reporta violaciones con la ruta permitida sugerida
    - Importa configuracion de sheriff y de Nx boundaries sin exigir duplicarla
    - Cero falsos positivos sobre las fixtures
    prompt: "Lee docs/PLAN.md, secciones 5.3 y 6 Fase 2, y el riesgo R10, antes\nde escribir nada.\n\n\
      Implementa el motor de reglas en packages/server/src/rules/.\n\n- schema.ts: esquema Zod del archivo\
      \ angular-mcp.rules.yaml tal\n  como lo define la seccion 5.3, con version, layers, boundaries,\n\
      \  constraints y decisions.\n- load.ts: carga y valida. Errores de esquema accionables, con la\n\
      \  linea del yaml.\n- evaluate.ts: resuelve la capa de cada archivo por glob, evalua\n  boundaries\
      \ sobre las aristas del grafo, y las constraints de tipo\n  forbid y require. Severidad error o\
      \ warning.\n- diff.ts: parsea un diff unificado, mapea los archivos tocados a\n  nodos y evalua\
      \ solo las aristas afectadas.\n- importers/sheriff.ts e importers/nx.ts: leen la configuracion que\n\
      \  el proyecto ya tenga y la traducen a layers y boundaries. R10\n  dice que no debe haber dos fuentes\
      \ de verdad.\n\nTambien implementa las tres herramientas de la Fase 2:\nangular_list_rules, angular_check_rules\
      \ y angular_explain_layer.\nVan en src/tools/, pero coordinate: ese directorio es de\nquery-tools.\
      \ Escribe las tuyas en src/rules/tools/ y exportalas\npara que el cableado del servidor las registre.\n\
      \nEscribe docs/RULES.md documentando el formato con ejemplos.\n"
  - id: server-wiring
    name: Cableado del servidor MCP en TypeScript
    max_turns: 100
    role: backend
    complexity: medium
    dependencies:
    - query-tools
    - rules-engine
    ownership:
    - packages/server/src/index.ts
    - packages/server/src/server.ts
    - packages/server/src/resources/**
    - packages/server/src/prompts/**
    - packages/server/test/server.test.ts
    acceptance:
    - El servidor arranca sobre stdio y lista todas las herramientas
    - Ningun log va a stdout
    - Expone los recursos angular://project/summary y angular://rules
    - Expone el prompt angular_plan_change
    - Valida que toda ruta recibida resuelva dentro de la raiz del proyecto
    prompt: "Lee docs/PLAN.md, secciones 6 Fase 4 y el riesgo R11, antes de\nescribir nada.\n\nCablea\
      \ el servidor MCP sobre stdio con el SDK oficial.\n\n- server.ts: registra todas las herramientas\
      \ de src/tools/ y de\n  src/rules/tools/, los recursos y el prompt. Capa fina, sin\n  logica de\
      \ dominio.\n- index.ts: entrada stdio. Todo log a stderr, nunca a stdout.\n- resources/: angular://project/summary\
      \ y angular://rules.\n- prompts/: angular_plan_change, la plantilla que guia la secuencia\n  find_symbol,\
      \ get_component, impact_of, find_similar, check_rules.\n\nR11, seguridad: valida que cualquier path\
      \ recibido resuelva dentro\nde la raiz del proyecto. Sin shell: si en algun momento ejecutas un\n\
      proceso, spawn con argumentos como array. Sin acceso de red.\n"
  - id: ground-truth
    name: Grafo esperado de las fixtures
    max_turns: 140
    role: test
    complexity: high
    dependencies:
    - indexer
    ownership:
    - fixtures/standalone-app/expected-graph.json
    - fixtures/ngmodule-app/expected-graph.json
    - packages/server/test/integration/**
    acceptance:
    - Los dos expected-graph.json estan escritos a mano desde el codigo de las fixtures
    - La prueba de integracion compara por igualdad estructural ignorando orden
    - Cualquier divergencia falla la prueba, no advierte
    prompt: 'Lee docs/PLAN.md, secciones 9.2 y 7 Fase 1, antes de escribir nada.


      Escribe el ground truth de las dos fixtures LEYENDO SU CODIGO, no

      ejecutando el indexador. El punto de un ground truth es ser

      independiente de lo que se esta probando. Si lo generas con el

      indexador, la prueba solo verifica que el indexador es consistente

      consigo mismo.


      Luego escribe la prueba de integracion que indexa cada fixture y

      compara con su expected-graph.json por igualdad estructural,

      ignorando el orden de nodos y aristas.


      Reporta en tu resultado la precision y el recall que midas. El

      criterio de salida de la Fase 1 es precision >= 95% y recall >= 90%.

      '
  - id: review
    name: Revision adversarial
    max_turns: 80
    role: review
    writes: false
    complexity: high
    dependencies:
    - server-wiring
    - ground-truth
    verifiers: 2
    acceptance:
    - Cada principio de la seccion 2 del plan se verifica contra el codigo real
    - Se nombra cada incumplimiento con archivo y linea
    prompt: "Lee docs/PLAN.md, seccion 2, antes de revisar.\n\nRevisa el codigo construido contra los\
      \ siete principios del plan.\nEn particular:\n\n- P1: hay algun hecho estructural que se persista\
      \ y no se pueda\n  rederivar del codigo.\n- P2: hay alguna herramienta cuya salida no sea reproducible\
      \ desde\n  el grafo, es decir que contenga juicio en vez de hechos.\n- P4: hay algun lugar donde\
      \ se adivine en vez de reportar unknown.\n- P6: hay alguna herramienta que pueda devolver una respuesta\
      \ sin\n  limite.\n- R11: hay algun path que se use sin validar que caiga dentro de la\n  raiz.\n\
      \nNombra cada incumplimiento con archivo y linea. No arregles nada:\neres de solo lectura. Si no\
      \ encuentras incumplimientos de un\nprincipio, dilo explicitamente en vez de omitirlo.\n"
  - id: docs
    name: README e instalacion
    max_turns: 60
    role: docs
    complexity: low
    dependencies:
    - server-wiring
    ownership:
    - README.md
    - docs/TOOLS.md
    acceptance:
    - El README explica que hace el servidor y como instalarlo en Claude Code y Cursor
    - docs/TOOLS.md lista cada herramienta con entrada, salida y un ejemplo
    - Al menos tres ejemplos de uso reales
    prompt: 'Lee docs/PLAN.md antes de escribir.


      Actualiza README.md: que resuelve el servidor, como instalarlo en

      Claude Code y en Cursor con el bloque de configuracion MCP, y un

      ejemplo de sesion que muestre el beneficio.


      Escribe docs/TOOLS.md: cada herramienta con su entrada, su salida y

      un ejemplo real tomado de las fixtures.


      No inventes herramientas que no existan en el codigo. Lee

      packages/server/src/tools/ y src/rules/tools/ antes de documentar.

      '
