metadata:
  name: Build Angular MCP
  description: 'Builds the Angular MCP server per docs/PLAN.md: template extraction, index orchestration, query tools, rules engine and server wiring.'
  version: 1.0.0
  type: graph
  author: Rixmerz
nodes:
- id: build
  name: Build
  is_start: true
  is_end: true
  node_type: dag
  prompt_injection: |
    Building the Angular MCP per docs/PLAN.md.
    Every task reads the plan before writing code and honours its principles:
    derive instead of remember, keep the server deterministic, and carry
    confidence and provenance on every fact.

    LANGUAGE: all code, comments, docstrings, error messages and documentation
    are written in English. No Spanish anywhere in the repository.
  tasks:
  - id: extract-templates
    name: Template extractor in TypeScript
    max_turns: 140
    role: backend
    complexity: high
    ownership:
    - packages/server/src/indexer/extractors/templates.ts
    - packages/server/src/indexer/extractors/selectors.ts
    - packages/server/test/indexer/templates.test.ts
    - packages/server/test/indexer/selectors.test.ts
    acceptance:
    - Templates are parsed with parseTemplate from the analyzed project's compiler
    - Interpolation, property, event, two-way and control flow bindings are classified
    - Selectors resolve against the component scope, standalone or NgModule
    - 'A template with a syntax error does not abort the index: parseErrors are stored'
    prompt: |
      Read docs/PLAN.md sections 4.3 and 5.2, and risks R4 and R14, before
      writing anything.

      Implement two files.

      - templates.ts: parse the template, whether in a file or inline, with
        parseTemplate from @angular/compiler resolved from the ANALYZED project
        (use the existing src/indexer/resolve.ts). Walk the AST and emit binds
        edges classified as: interpolation, property, event, two-way, modern
        control flow @if/@for/@switch/@defer/@let, legacy structural directives
        *ngIf/*ngFor, pipes and #ref references.
        If parsing fails, store parseErrors on the Template node and carry on.
        Never abort the whole index because one template is broken.
      - selectors.ts: resolve a template tag or attribute to its Component,
        Directive or Pipe. Scope comes from a standalone component's imports
        array, or from the declarations of the NgModule that declares it. The
        hybrid case, a standalone component imported from an NgModule, must
        work. Anything you cannot resolve gets confidence 'unknown'.

      Binding types come from the component class via the TypeScript type
      checker. Do NOT use TemplateTypeChecker.

      Reuse the existing model in src/graph/model.ts and the extractors already
      in src/indexer/extractors/ as a style reference.

      LANGUAGE: write ALL comments, docstrings, error messages and any
      documentation in English. The repository is English-only.
    timeout_s: 2700
  - id: indexer
    name: Index orchestrator in TypeScript
    max_turns: 120
    role: backend
    complexity: high
    dependencies:
    - extract-templates
    ownership:
    - packages/server/src/indexer/index.ts
    - packages/server/src/indexer/incremental.ts
    - packages/server/test/indexer/index.test.ts
    - packages/server/test/indexer/incremental.test.ts
    acceptance:
    - Indexes a whole project by calling every extractor
    - Incremental reindexing only reprocesses files whose hash changed
    - Reports nodes per type, files processed, elapsed time and parse errors
    - A broken file does not abort the index
    prompt: |
      Read docs/PLAN.md sections 4.1 and 7 Phase 1 before writing anything.

      Implement the orchestrator that walks the project's files, calls each
      extractor already present in src/indexer/extractors/ and builds the
      ProjectGraph from src/graph/.

      - index.ts: full indexing of one angular.json project. Templates are
        parsed on demand and cached.
      - incremental.ts: compare hashes, reindex only what changed, invalidate
        the edges that originated in the affected files.

      Return a summary: nodes per type, files, elapsed time, parse errors. A
      file that fails is recorded and the walk continues.

      LANGUAGE: write ALL comments, docstrings, error messages and any
      documentation in English. The repository is English-only.
    timeout_s: 2400
  - id: query-tools
    name: Query and impact tools in TypeScript
    max_turns: 150
    role: backend
    complexity: high
    dependencies:
    - indexer
    ownership:
    - packages/server/src/tools/**
    - packages/server/test/tools/**
    acceptance:
    - The ten Phase 1 tools from section 6 exist
    - Each declares a Zod input schema, an outputSchema and annotations
    - All are readOnlyHint true
    - angular_find_symbol always returns candidates, never guesses one
    - angular_impact_of walks consumers and dependencies with a depth limit
    prompt: |
      Read docs/PLAN.md section 6 Phase 1 in full, plus risks R7 and R13,
      before writing anything.

      Implement the ten Phase 1 tools, one per file, in src/tools/:

      index_project, get_index_status, find_symbol, get_component,
      get_service, get_route_tree, who_uses, get_template_bindings,
      list_http_calls, impact_of.

      All prefixed angular_. Each one:
      - Zod input schema, with a description on every field.
      - A declared outputSchema.
      - Annotations: readOnlyHint true, destructiveHint false,
        idempotentHint true, openWorldHint false.
      - Accepts limit, offset and format where it applies, using the existing
        src/format/ layer.
      - Actionable errors: what failed and what to try next.

      R13: a symbol id is path#name. find_symbol returns candidates. The others
      require the full ref and, given an ambiguous name, return the candidates
      instead of choosing.

      R7: every fact carries its confidence and provenance. Each tool's
      description states explicitly which fields may be inferred.

      LANGUAGE: write ALL comments, docstrings, error messages and any
      documentation in English. The repository is English-only.
    timeout_s: 2700
  - id: rules-engine
    name: Architecture rules engine in TypeScript
    max_turns: 150
    role: backend
    complexity: high
    dependencies:
    - indexer
    ownership:
    - packages/server/src/rules/**
    - packages/server/test/rules/**
    - docs/RULES.md
    acceptance:
    - Validates angular-mcp.rules.yaml against a Zod schema
    - Evaluates layers, boundaries and constraints against the graph
    - angular_check_rules takes a unified diff and reports violations with a suggested allowed path
    - Imports sheriff and Nx boundary configuration without requiring duplication
    - Zero false positives on the fixtures
    prompt: |
      Read docs/PLAN.md sections 5.3 and 6 Phase 2, plus risk R10, before
      writing anything.

      Implement the rules engine in src/rules/.

      - schema.ts: Zod schema for angular-mcp.rules.yaml exactly as section 5.3
        defines it, with version, layers, boundaries, constraints and decisions.
      - load.ts: load and validate. Schema errors must be actionable and name
        the YAML line.
      - evaluate.ts: resolve each file's layer by glob, evaluate boundaries over
        the graph's edges, and the forbid and require constraints. Severity
        error or warning.
      - diff.ts: parse a unified diff, map touched files to nodes and evaluate
        only the affected edges.
      - importers/sheriff.ts and importers/nx.ts: read whatever configuration
        the project already has and translate it into layers and boundaries.
        R10 says there must not be two sources of truth.

      Also implement the three Phase 2 tools: angular_list_rules,
      angular_check_rules and angular_explain_layer. Put them in
      src/rules/tools/ and export them, because src/tools/ belongs to another
      task.

      Write docs/RULES.md documenting the format with examples.

      LANGUAGE: write ALL comments, docstrings, error messages and any
      documentation in English. The repository is English-only.
    timeout_s: 2700
  - id: server-wiring
    name: MCP server wiring in TypeScript
    max_turns: 100
    role: backend
    complexity: medium
    dependencies:
    - query-tools
    - rules-engine
    ownership:
    - packages/server/src/index.ts
    - packages/server/src/server.ts
    - packages/server/src/resources/**
    - packages/server/src/prompts/**
    - packages/server/test/server.test.ts
    acceptance:
    - The server starts over stdio and lists every tool
    - No log goes to stdout
    - Exposes the angular://project/summary and angular://rules resources
    - Exposes the angular_plan_change prompt
    - Validates that every incoming path resolves inside the project root
    prompt: |
      Read docs/PLAN.md section 6 Phase 4 and risk R11 before writing anything.

      Wire the MCP server over stdio with the official SDK.

      - server.ts: register every tool from src/tools/ and src/rules/tools/,
        the resources and the prompt. A thin layer, no domain logic.
      - index.ts: stdio entry point. All logging to stderr, never stdout.
      - resources/: angular://project/summary and angular://rules.
      - prompts/: angular_plan_change, the template that guides the sequence
        find_symbol, get_component, impact_of, find_similar, check_rules.

      R11, security: validate that any incoming path resolves inside the
      project root. No shell: if you ever spawn a process, pass arguments as an
      array. No network access.

      LANGUAGE: write ALL comments, docstrings, error messages and any
      documentation in English. The repository is English-only.
    timeout_s: 1800
  - id: ground-truth
    name: Expected graph for the fixtures
    max_turns: 140
    role: test
    complexity: high
    dependencies:
    - indexer
    ownership:
    - fixtures/standalone-app/expected-graph.json
    - fixtures/ngmodule-app/expected-graph.json
    - packages/server/test/integration/**
    acceptance:
    - Both expected-graph.json files are written by hand from the fixture source
    - The integration test compares by structural equality, ignoring order
    - Any divergence fails the test, it does not warn
    prompt: |
      Read docs/PLAN.md sections 9.2 and 7 Phase 1 before writing anything.

      Write the ground truth for both fixtures by READING THEIR SOURCE, not by
      running the indexer. The whole point of a ground truth is to be
      independent of the thing under test. If you generate it with the indexer,
      the test only proves the indexer agrees with itself.

      Then write the integration test that indexes each fixture and compares it
      against its expected-graph.json by structural equality, ignoring the
      order of nodes and edges.

      Report the precision and recall you measure. The Phase 1 exit criterion
      is precision >= 95% and recall >= 90%.

      LANGUAGE: write ALL comments, docstrings, error messages and any
      documentation in English. The repository is English-only.
    timeout_s: 2400
  - id: review
    name: Adversarial review
    max_turns: 80
    role: review
    writes: false
    complexity: high
    dependencies:
    - server-wiring
    - ground-truth
    verifiers: 2
    acceptance:
    - Every principle in section 2 of the plan is checked against the real code
    - Each breach is named with file and line
    prompt: |
      Read docs/PLAN.md section 2 before reviewing.

      Review the code built so far against the plan's seven principles. In
      particular:

      - P1: is any structural fact persisted that cannot be re-derived from the
        code.
      - P2: is there any tool whose output is not reproducible from the graph,
        that is, that contains judgement instead of facts.
      - P4: is there anywhere that guesses instead of reporting unknown.
      - P6: is there any tool that can return an unbounded response.
      - R11: is there any path used without validating that it falls inside the
        project root.

      Name each breach with file and line. Do not fix anything: you are
      read-only. If you find no breach of a principle, say so explicitly rather
      than omitting it.

      LANGUAGE: write ALL comments, docstrings, error messages and any
      documentation in English. The repository is English-only.
    timeout_s: 1800
  - id: docs
    name: README and tool catalogue
    max_turns: 60
    role: docs
    complexity: low
    dependencies:
    - server-wiring
    ownership:
    - README.md
    - docs/TOOLS.md
    acceptance:
    - The README explains what the server does and how to install it in Claude Code and Cursor
    - docs/TOOLS.md lists every tool with its input, output and an example
    - At least three real usage examples
    prompt: |
      Read docs/PLAN.md before writing.

      Update README.md: what the server solves, how to install it in Claude Code
      and in Cursor with the MCP configuration block, and an example session
      that shows the benefit.

      Write docs/TOOLS.md: every tool with its input, its output and a real
      example taken from the fixtures.

      Do not invent tools that do not exist in the code. Read src/tools/ and
      src/rules/tools/ before documenting.

      LANGUAGE: write ALL comments, docstrings, error messages and any
      documentation in English. The repository is English-only.
    timeout_s: 1200
